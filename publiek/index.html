<html lang="nl">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <a href="#" class="nav-brand"><img src="logo.webp" alt="TAM" class="nav-logo">Presentielijst TR1</a>

    </nav>
    <main id="app"></main>

<script>
const SYNC_URL = 'https://aanwezigheid-sync.tam-floris.workers.dev';
let DATA = null;
let ADMIN_DATA = null;
let TRAINER_DATA = null;

// --- Auth ---
function getAuth() { const r = localStorage.getItem('aanwezigheid_auth'); return r ? JSON.parse(r) : null; }
function setAuth(a) { localStorage.setItem('aanwezigheid_auth', JSON.stringify(a)); }
function clearAuth() { localStorage.removeItem('aanwezigheid_auth'); ADMIN_DATA = null; TRAINER_DATA = null; }
function isAdmin() { return getAuth()?.role === 'admin'; }
function getTrainerId() { return getAuth()?.role === 'trainer' ? getAuth().trainer_id : null; }

// Afmeldingen uit Genkgo, opgehaald na het inloggen. Per Genkgo-groepsnummer
// per datum: wie zich heeft afgemeld, en hoeveel overnames er waren.
// Ze staan bewust niet in `/data`: dat is een openbaar adres.
let AFMELDINGEN = {};
// De rest van wat /afmeldingen teruggeeft: wanneer hij voor het laatst is
// gelukt, of hij op rij mislukt, en welke namen niet te koppelen waren. Dat
// hoort niet in de presentielijst maar wel op de instellingenpagina, want het
// is het enige waaraan je ziet of de koppeling nog leeft.
let AFMELDINGEN_META = {};

/**
 * De lesdagen van een groep.
 *
 * Leidend is de planning in Genkgo. Die haalt de app elke ochtend om 10:00 al
 * op voor de afmeldingen, en het is de plek waar de trainingsleider de
 * trainingen neerzet. Door hem hier te gebruiken hoeft niemand de datums nog
 * apart in deze app bij te houden: verzet Niels een training, dan volgt de
 * presentielijst de volgende ochtend vanzelf.
 *
 * Staat er voor een groep geen planning -- Genkgo onbereikbaar, of de ronde is
 * nog niet ingericht -- dan vallen we terug op wat er in de app staat. Anders
 * zou een storing bij Genkgo de presentielijsten leegmaken, en dat is een veel
 * groter probleem dan een datum die een dag te laat verschijnt.
 */
function lesdagen(group) {
    const planning = Object.keys(AFMELDINGEN[String(group.genkgoId)] || {});
    return (planning.length ? planning : (group.dates || [])).slice().sort();
}

/**
 * Datums waarop al aanwezigheid is ingevuld maar die niet (meer) in de
 * planning staan. Zulke lessen vallen uit de telling zodra de planning
 * verandert, en dat mag niet stilletjes gebeuren.
 */
function buitenPlanning(group) {
    const dagen = new Set(lesdagen(group));
    const ingevuld = new Set([
        ...Object.keys(group.attendance || {}),
        ...Object.keys(group.totalPresent || {}),
    ]);
    return [...ingevuld].filter(d => !dagen.has(d)).sort();
}

/** De namen die zich hebben afgemeld voor deze groep op deze datum. */
function afgemeldOp(group, date) {
    const dag = AFMELDINGEN[String(group.genkgoId)]?.[date];
    if (!dag) return [];
    // `gekoppeld` bevat de naam zoals de app die kent; Genkgo schrijft
    // doopnamen ("Anna Jaya Elisabeth Apte") waar de app "Anna Apte" heeft.
    return (dag.gekoppeld || []).filter(Boolean);
}

/**
 * Is deze training al ingevuld door de trainer?
 *
 * Een voorbije datum zonder ingevulde presentie betekent niet dat er niemand
 * was -- het betekent dat de trainer er nog niet aan toe is gekomen. Zulke
 * trainingen tellen daarom niet mee in de percentages; anders zakt een groep
 * doordat de trainer nog niets heeft aangevinkt. Hetzelfde geldt voor een
 * training die vandaag nog moet beginnen.
 *
 * Vinkt een trainer bewust niemand aan, dan staat er een lege lijst en telt
 * de training wel gewoon mee.
 */
function isIngevuld(group, date) {
    return (group.attendance && date in group.attendance)
        || (group.totalPresent && date in group.totalPresent);
}

/**
 * Trainingen die al zijn geweest maar nog niet zijn ingevuld.
 * Nieuwste eerst, want dat is meestal degene die je zoekt.
 */
function openTrainingen(group) {
    const vandaag = new Date().toISOString().slice(0, 10);
    return lesdagen(group)
        .filter(d => d <= vandaag && !(group.cancelled || []).includes(d) && !isIngevuld(group, d))
        .sort().reverse();
}

function isAfgemeld(group, date, player) {
    return afgemeldOp(group, date).includes(player);
}

// --- API ---
async function fetchData() { const r = await fetch(SYNC_URL + '/data'); DATA = await r.json(); return DATA; }

async function fetchAfmeldingen() {
    const auth = getAuth();
    if (!auth) return;
    try {
        const r = await fetch(SYNC_URL + '/afmeldingen', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: auth.code }),
        });
        const j = await r.json();
        AFMELDINGEN = j.perGroep || {};
        AFMELDINGEN_META = { bijgewerkt: j.bijgewerkt, status: j.status,
                             onbekend: j.onbekend, fouten: j.fouten };
    } catch (e) {
        // Geen afmeldingen is vervelend maar niet fataal: de presentielijst
        // werkt gewoon, er staat alleen niets voorgevuld.
        AFMELDINGEN = {};
        AFMELDINGEN_META = { fout: String(e && e.message || e) };
    }
}

async function apiLogin(code) {
    const r = await fetch(SYNC_URL + '/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ code }),
    });
    return r.json();
}

async function apiPost(path, body) {
    const auth = getAuth();
    const r = await fetch(SYNC_URL + path, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ code: auth.code, ...body }),
    });
    return r.json();
}

// --- Helpers ---
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Het gemiddelde meet opkomst: welk deel van de groep kwam er. De deler is
// dus het aantal spelers in de groep.
//
// Hier stond een vaste deler van 8 (of 16 voor de dubbele slots), die de
// bezetting van de baan mat in plaats van de opkomst. Dat gaf percentages
// boven de 100 zodra er meer mensen kwamen dan er plek was -- 11 aanwezig
// gedeeld door 8 is 138%. Wil je die maat terug, gebruik dan `capacity` uit
// het groepsprofiel in Genkgo; dat is de echte capaciteit en wordt door de
// vereniging bijgehouden, in plaats van een lijst groepsnamen in deze code.

/**
 * Percentage tonen. Nul meegetelde trainingen is geen nul procent: er is dan
 * gewoon nog niets gemeten, bijvoorbeeld omdat de trainer nog niets heeft
 * ingevuld of omdat iemand zich voor alles had afgemeld. Dat als rode 0%
 * tonen leest als slechte opkomst, en daar hangen boetes aan.
 */
function pctCel(ps) {
    if (!ps.effectiveSessions) return '<td class="num leeg">-</td>';
    return `<td class="num ${pctClass(ps.pct)}">${ps.pct}%</td>`;
}

function pctClass(pct) {
    if (pct < 50) return 'pct-red';
    if (pct < 75) return 'pct-yellow';
    return 'pct-green';
}

function barColor(pct) {
    if (pct < 50) return 'var(--red)';
    if (pct < 75) return 'var(--yellow)';
    return 'var(--green)';
}

function formatDate(d) {
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
}

const DAY_NAMES = ['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'];

function generateWeeklyDates(dayOfWeek, startDate, endDate) {
    // dayOfWeek: 1=Monday, 7=Sunday (ISO)
    const dates = [];
    const jsDow = dayOfWeek % 7; // convert to JS: 0=Sun, 1=Mon, ...
    const start = new Date(startDate + 'T00:00:00');
    const end = new Date(endDate + 'T00:00:00');
    const current = new Date(start);
    // Move to first matching day
    while (current.getDay() !== jsDow && current <= end) {
        current.setDate(current.getDate() + 1);
    }
    while (current <= end) {
        const y = current.getFullYear();
        const m = String(current.getMonth() + 1).padStart(2, '0');
        const d = String(current.getDate()).padStart(2, '0');
        dates.push(`${y}-${m}-${d}`);
        current.setDate(current.getDate() + 7);
    }
    return dates;
}

function calcGroupStats(group) {
    const today = new Date().toISOString().slice(0, 10);
    const activeDates = lesdagen(group).filter(d => !(group.cancelled || []).includes(d) && d <= today && isIngevuld(group, d));
    const totalSessions = activeDates.length;
    const playerStats = group.players.map(player => {
        let count = 0;
        let excusedCount = 0;
        for (const d of activeDates) {
            if ((group.attendance?.[d] || []).includes(player)) count++;
            // Een afmelding via Genkgo telt hetzelfde als een handmatig
            // geoorloofde afwezigheid: die training valt uit de noemer van
            // deze speler. Wie zich netjes afmeldt, hoort daar in zijn
            // percentage niet op afgerekend te worden.
            else if ((group.excused?.[d] || []).includes(player)
                     || isAfgemeld(group, d, player)) excusedCount++;
        }
        const effectiveSessions = totalSessions - excusedCount;
        const pct = effectiveSessions > 0 ? Math.round((count / effectiveSessions) * 100) : 0;
        return { player, count, totalSessions, excusedCount, effectiveSessions, pct };
    });
    // Use totalPresent (incl. subs) per date when available, otherwise count from checklist
    let avgAttendance = 0;
    if (totalSessions > 0 && group.players.length > 0) {
        let presentSum = 0;
        for (const d of activeDates) {
            const tp = group.totalPresent?.[d];
            presentSum += tp != null ? tp : (group.attendance?.[d] || []).length;
        }
        avgAttendance = Math.round((presentSum / (totalSessions * group.players.length)) * 100);
    }
    return { playerStats, totalSessions, avgAttendance };
}

// --- Rendering ---
function renderNav() {
    const el = document.getElementById('nav-auth');
    const auth = getAuth();
    if (isAdmin()) {
        el.innerHTML = `<span class="nav-role">Trainingsleider</span>
            <a href="#instellingen" class="nav-link">Instellingen</a>
            <a href="#" class="nav-link" id="logout-btn">Uitloggen</a>`;
    } else if (auth?.role === 'trainer') {
        el.innerHTML = `<span class="nav-role">${esc(auth.trainer_name)}</span>
            <a href="#" class="nav-link" id="logout-btn">Uitloggen</a>`;
    } else {
        el.innerHTML = '';
    }
    document.getElementById('logout-btn')?.addEventListener('click', e => { e.preventDefault(); clearAuth(); navigate(''); });
}

function renderLogin() {
    return `<div class="login-center"><div class="login-card">
        <h1>TAM Presentielijst TR1</h1>
        <p class="login-hint">Voer je trainerscode of admincode in</p>
        <form id="login-form">
            <input type="password" id="login-code" placeholder="Code" autofocus required>
            <p class="error" id="login-error" style="display:none"></p>
            <button type="submit">Inloggen</button>
        </form>
    </div></div>`;
}

function renderHome() {
    if (!DATA) return '<p>Laden...</p>';

    // Trainer view: only their groups
    if (getTrainerId()) {
        const trainerId = getTrainerId();
        const src = TRAINER_DATA || DATA?.trainers?.find(t => t.id === trainerId);
        if (!src) return '<p>Trainer niet gevonden.</p>';
        const trainer = src.groups ? src : { groups: [] };
        let html = `<h1>Mijn groepen</h1>`;
        if (trainer.groups.length === 0) {
            return html + '<p class="empty">Nog geen groepen toegewezen. Neem contact op met de trainingsleider.</p>';
        }
        for (const group of trainer.groups) {
            const stats = calcGroupStats(group);
            const open = openTrainingen(group);
            html += `<a href="#group/${trainerId}/${group.id}" class="card card-link${open.length ? ' heeft-open' : ''}">
                <h3>${esc(group.name)}${open.length ? `<span class="open-badge">${open.length} in te vullen</span>` : ''}</h3>
                <p>${group.players.length} spelers, ${stats.totalSessions} ${stats.totalSessions === 1 ? 'les' : 'lessen'} geteld${stats.totalSessions ? `, ${stats.avgAttendance}% gem. aanwezigheid` : ''}</p>
                <div class="overview-bar"><div class="overview-bar-fill" style="width:${stats.avgAttendance}%;background:${barColor(stats.avgAttendance)}"></div></div>
            </a>`;
        }
        return html;
    }

    // Admin view: all trainers with inline edit controls
    const src = isAdmin() && ADMIN_DATA ? ADMIN_DATA : DATA;

    // Calculate total club average (using totalPresent-aware group averages)
    let totalPctSum = 0, totalPctCount = 0;
    const trainerAvgs = {};
    for (const trainer of src.trainers) {
        let tSum = 0, tCount = 0;
        for (const group of trainer.groups) {
            const stats = calcGroupStats(group);
            if (stats.totalSessions > 0) { tSum += stats.avgAttendance; tCount++; }
        }
        trainerAvgs[trainer.id] = tCount > 0 ? Math.round(tSum / tCount) : 0;
        totalPctSum += tSum;
        totalPctCount += tCount;
    }
    const clubAvg = totalPctCount > 0 ? Math.round(totalPctSum / totalPctCount) : 0;

    let html = `<h1>Overzicht Aanwezigheid</h1>
        <div class="club-avg card" style="margin-bottom:16px">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                <div>
                    <strong>Totaal clubgemiddelde</strong>
                    <span class="pct ${pctClass(clubAvg)}" style="margin-left:8px;font-size:1rem">${clubAvg}%</span>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                    <a href="#eind" class="btn-sm">Eindoverzicht</a>
                    <button class="btn-sm" id="export-btn">Exporteer naar spreadsheet</button>
                </div>
            </div>
            <div class="overview-bar" style="margin-top:8px"><div class="overview-bar-fill" style="width:${clubAvg}%;background:${barColor(clubAvg)}"></div></div>
        </div>`;

    if (src.trainers.length === 0) {
        html += '<p class="empty">Nog geen trainers toegevoegd.</p>';
    }

    html += `<div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap">
        <input type="text" id="search-field" placeholder="Zoek trainer, dag, groep..." style="flex:1;padding:8px 12px;border:2px solid var(--border);border-radius:var(--radius);font-size:0.9rem">
        ${isAdmin() ? '<button class="btn-sm btn-muted" id="toggle-delete-btn">Verwijdermodus</button>' : ''}
    </div>`;



    if (isAdmin()) {
        html += `<details style="margin-bottom:16px">
            <summary style="cursor:pointer;font-size:0.9rem;font-weight:600;color:var(--blue)">+ Trainer toevoegen</summary>
            <form id="add-trainer-form" class="form-row" style="margin-top:8px">
                <input type="text" name="name" placeholder="Naam nieuwe trainer" required>
                <button type="submit">Toevoegen</button>
            </form>
        </details>`;
    }

    for (const trainer of src.trainers) {
        const trainerSearch = trainer.name + ' ' + trainer.groups.map(g => g.name).join(' ');
        html += `<div class="card trainer-card" data-search="${esc(trainerSearch.toLowerCase())}">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                <div>
                    <h3 style="display:inline">${esc(trainer.name)}</h3>
                    <span class="pct ${pctClass(trainerAvgs[trainer.id])}" style="margin-left:8px;font-size:0.85rem">${trainerAvgs[trainer.id]}% gem.</span>
                    ${isAdmin() && trainer.code ? `<span class="trainer-code" style="margin-left:8px">Code: ${esc(trainer.code)}</span>` : ''}
                </div>
                ${isAdmin() ? `<button class="btn-sm btn-danger delete-btn delete-trainer-btn" data-trainer-id="${trainer.id}">Verwijderen</button>` : ''}
            </div>`;

        // Groups
        html += '<div style="margin-top:12px">';
        if (trainer.groups.length === 0) {
            html += '<p class="empty">Geen groepen</p>';
        }
        for (const group of trainer.groups) {
            const stats = calcGroupStats(group);
            html += `<div style="padding:8px 0;border-top:1px solid var(--border)">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                    <a href="#group/${trainer.id}/${group.id}" style="color:var(--blue);font-weight:600">${esc(group.name)}</a>
                    ${isAdmin() ? `<button class="btn-sm btn-danger delete-btn delete-group-btn" data-trainer-id="${trainer.id}" data-group-id="${group.id}">X</button>` : ''}
                </div>
                <div style="font-size:0.85rem;color:var(--muted)">${group.players.length} spelers, ${stats.totalSessions} lessen</div>
                <div class="overview-bar"><div class="overview-bar-fill" style="width:${stats.avgAttendance}%;background:${barColor(stats.avgAttendance)}"></div></div>
                <span class="pct ${pctClass(stats.avgAttendance)}" style="font-size:0.8rem">${stats.avgAttendance}% gem. aanwezigheid</span>`;

            if (isAdmin()) {
                html += `
                <details class="edit-players-detail" style="margin-top:4px">
                    <summary style="cursor:pointer;font-size:0.85rem;color:var(--blue)">Spelers bewerken</summary>
                    <form class="edit-players-form" data-trainer-id="${trainer.id}" data-group-id="${group.id}" style="margin-top:4px">
                        <div class="form-row">
                            <textarea name="players" placeholder="Eén speler per regel">${esc(group.players.join('\n'))}</textarea>
                        </div>
                        <button type="submit" class="btn-sm">Opslaan</button>
                    </form>
                </details>
`;
            }

            html += '</div>';
        }

        if (isAdmin()) {
            html += `<details class="add-group-section" style="margin-top:12px;padding-top:8px;border-top:1px solid var(--border)">
                <summary style="cursor:pointer;font-size:0.9rem;font-weight:600;color:var(--blue)">+ Nieuwe groep</summary>
                <form class="add-group-form" data-trainer-id="${trainer.id}" style="margin-top:8px">
                    <div class="form-row">
                        <select name="day" required>
                            <option value="">Dag</option>
                            ${['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'].map(d =>
                                `<option value="${d}">${d}</option>`
                            ).join('')}
                        </select>
                        <input type="time" name="start_time" required>
                        <input type="time" name="end_time" required>
                    </div>
                    <div class="form-row">
                        <input type="number" name="speelsterkte" placeholder="Speelsterkte (optioneel)" min="1" max="12">
                        <label style="display:flex;align-items:center;gap:4px;font-size:0.9rem"><input type="checkbox" name="selectie"> Selectie</label>
                    </div>
                    <div class="form-row">
                        <input type="date" name="start_date" required>
                        <input type="date" name="end_date" required>
                    </div>
                    <button type="submit" class="btn-sm">Groep toevoegen</button>
                </form>
            </details>`;
        }

        html += '</div></div>';
    }

    html += '<h2><a href="#overview" style="color:var(--blue)">Volledig overzicht per speler &rarr;</a></h2>';
    return html;
}

function renderOverview() {
    if (!DATA) return '<p>Laden...</p>';
    const src = isAdmin() && ADMIN_DATA ? ADMIN_DATA : DATA;
    let html = '<a href="#" class="back-link">&larr; Terug</a><h1>Volledig Overzicht</h1>';

    for (const trainer of src.trainers) {
        for (const group of trainer.groups) {
            const stats = calcGroupStats(group);
            html += `<div class="overview-group">
                <h3>${esc(group.name)}</h3>
                <div class="trainer-name">Trainer: ${esc(trainer.name)}</div>
                <div class="table-wrap"><table class="data">
                    <thead><tr><th>Speler</th><th class="num">Aanwezig</th><th class="num">Afgemeld</th>
                        <th class="num">Meegeteld</th><th class="num">Percentage</th></tr></thead>
                    <tbody>`;
            for (const ps of [...stats.playerStats].sort((a, b) => b.pct - a.pct)) {
                html += `<tr>
                    <td>${esc(ps.player)}</td>
                    <td class="num">${ps.count}</td>
                    <td class="num${ps.excusedCount ? '' : ' leeg'}">${ps.excusedCount || '-'}</td>
                    <td class="num">${ps.effectiveSessions}</td>
                    ${pctCel(ps)}
                </tr>`;
            }
            html += '</tbody></table></div></div>';
        }
    }
    return html;
}

/** "16-09-2026 om 10:00" plus hoe lang geleden dat was. */
function tijdstip(iso) {
    if (!iso) return 'onbekend';
    const d = new Date(iso);
    const uren = Math.round((Date.now() - d) / 36e5);
    const geleden = uren < 1 ? 'zojuist' : uren < 24 ? `${uren} uur geleden`
        : `${Math.round(uren / 24)} dagen geleden`;
    return `${d.toLocaleString('nl-NL', { dateStyle: 'short', timeStyle: 'short' })} (${geleden})`;
}

/**
 * Instellingen en uitleg voor de trainingsleider.
 *
 * Dit scherm bestaat zodat de app niet afhangt van wie hem gebouwd heeft.
 * Alles wat je moet weten om hem draaiende te houden staat hier, inclusief
 * wat er vanzelf gebeurt en wat je zelf moet doen bij een nieuwe ronde.
 */
function renderInstellingen() {
    const src = ADMIN_DATA || DATA;
    const meta = AFMELDINGEN_META || {};
    const st = meta.status || {};
    const groepen = src.trainers.flatMap(t => t.groups);

    // Een groep zonder planning in Genkgo krijgt nooit lesdagen of
    // afmeldingen. Dat is stil misgegaan toen een donderdaggroep geen planning
    // had, dus het hoort hier zichtbaar te zijn.
    const zonderPlanning = groepen.filter(g =>
        !Object.keys(AFMELDINGEN[String(g.genkgoId)] || {}).length);
    const openTotaal = groepen.reduce((n, g) => n + openTrainingen(g).length, 0);
    const mislukt = st.mislukt_op_rij || 0;
    const ronde = (src.genkgo || {}).ronde, seizoen = (src.genkgo || {}).seizoen;

    const meldingen = [];
    if (mislukt >= 2) meldingen.push(`De ophaal uit Genkgo is ${mislukt} keer op rij mislukt.
        Laatste fout: ${esc(st.laatsteFout?.melding || 'onbekend')}`);
    if (zonderPlanning.length) meldingen.push(`${zonderPlanning.length}
        ${zonderPlanning.length === 1 ? 'groep heeft' : 'groepen hebben'} geen planning in Genkgo:
        ${zonderPlanning.map(g => esc(g.name)).join(', ')}. Die groep krijgt geen lesdagen
        en geen afmeldingen tot de planning er staat.`);

    let html = `<a href="#" class="back-link">&larr; Terug</a>
        <h1>Instellingen en uitleg</h1>
        <p class="lead">Voor de trainingsleider. Hier staat hoe de app aan zijn gegevens komt,
        wat er vanzelf gebeurt en wat je zelf moet doen.</p>`;

    // --- status ---
    html += `<div class="card inst-status">
        <h2>Status</h2>
        <dl class="inst-dl">
            <dt>Afmeldingen laatst opgehaald</dt><dd>${esc(tijdstip(meta.bijgewerkt || st.laatsteGeslaagd))}</dd>
            <dt>Trainingsronde</dt><dd>${ronde ? esc(`${seizoen?.naam || ''} ${ronde.naam}`.trim())
                : 'nog niet vastgelegd, draai een keer de indeling'}</dd>

        <p><strong>De trainingsleider</strong> logt in met de admincode en ziet alles: alle groepen,

    html += stuk('Waar de gegevens vandaan komen', `
        <p>Alles komt uit Genkgo. Deze app houdt zelf niets bij behalve de vinkjes.</p>

            <li><strong>Groepen, spelers en trainers</strong> komen uit de organisatieboom, onder

            <li><strong>De lesdagen</strong> komen uit de planning van elke groep in Genkgo. Zet je

            <li><strong>De afmeldingen</strong> komen van dezelfde planningpagina. Wie zich netjes

        <p>Staat er iets fout in de app, kijk dan eerst in Genkgo. Negen van de tien keer zit het

    html += stuk('Wat er vanzelf gebeurt', `
        <ul>
            <li><strong>Elke ochtend om 10:00</strong> worden de afmeldingen en de lesdagen uit

        </ul>
        <p>De indeling zelf wordt niet automatisch opgehaald. Dat is met opzet: je wilt zien wat er

    html += stuk('Een nieuwe trainingsronde', `
        <ol>
            <li>Maak de groepen in Genkgo aan onder de nieuwe trainingsronde. Dat mag over meerdere
            dagen; de app blijft ondertussen gewoon de lopende ronde tonen.</li>
            <li>Is de nieuwe ronde compleet, klik dan hierboven op Controleren. Je ziet dan staan
            dat er een volgende ronde klaarstaat en hoeveel groepen die heeft.</li>
            <li>Klopt het, dan Toepassen. Vanaf dat moment werkt de app met de nieuwe ronde.</li>
        </ol>
        <p>De vinkjes van de vorige ronde blijven bewaard. Er hoeft niets in de code te veranderen,

    html += stuk('Een nieuwe trainer', `
        <p>Zet de naam in Genkgo in het veld <code>x_Trainer</code> van zijn groepen en klik hier op
        Controleren. De app meldt dan dat er een onbekende trainer is en vraagt of je hem wilt
        toevoegen.</p>
        <p>Let goed op de schrijfwijze: die moet overal hetzelfde zijn. Staat er ergens
        &ldquo;Philipa&rdquo; en elders &ldquo;Philippa&rdquo;, dan krijg je twee trainers met twee
        codes, waarvan er eentje een lege lijst heeft. Daarom voegt de app ze niet vanzelf toe.</p>
        <p>Na het toevoegen staat zijn code achter zijn naam in het overzicht. Die geef je aan hem
        door; hij hoeft hem maar één keer per apparaat in te voeren.</p>`);

    html += stuk('Als er iets misgaat', `
        <p><strong>Een trainer ziet geen groepen.</strong> Dan staat zijn naam in Genkgo net anders
        geschreven dan in de app. Verbeter hem in Genkgo en haal de indeling opnieuw op.</p>
        <p><strong>Een groep heeft geen lesdagen.</strong> Dan ontbreekt de planning in Genkgo. Vul

        <p><strong>Iemand staat afwezig terwijl hij zich had afgemeld.</strong> Kijk of hij in Genkgo
        in de goede groep staat. Afmeldingen van iemand die de groep niet in staat kunnen we niet

        <p><strong>De status hierboven meldt mislukte ophalen.</strong> Twee keer op rij is geen

    html += stuk('Aan het eind van de ronde', `
        <p>Via <a href="#eind">Eindoverzicht</a> krijg je een overzicht per trainer of per speler
        dat je kunt afdrukken of als pdf bewaren. Handig voor de trainingsboetes en voor het
        overleg met de trainers.</p>
        <p>Wil je met de cijfers rekenen, gebruik dan Exporteer naar spreadsheet op de
        hoofdpagina.</p>`);

    return html;
}

function bindInstellingen() {
    document.getElementById('sync-btn')?.addEventListener('click', () => syncDraaien(false));
    document.getElementById('nietgekomen-btn')?.addEventListener('click', nietGekomenTonen);
}

/**
 * De lijst van wie er niet kwam opdagen zonder afmelding.
 *
 * Wordt op verzoek opgehaald en niet bij het openen van de pagina: het is een
 * zwaardere berekening en je hebt hem niet elke keer nodig.
 */
async function nietGekomenTonen() {
    const knop = document.getElementById('nietgekomen-btn');
    const uit = document.getElementById('nietgekomen-uitslag');
    if (!uit) return;
    if (knop) { knop.disabled = true; knop.textContent = 'Bezig...'; }
    uit.innerHTML = '<p class="sync-bezig">Bezig met ophalen.</p>';

    let r;
    try { r = await apiPost('/admin/niet-gekomen', {}); }
    catch (e) { r = { error: String(e && e.message || e) }; }
    if (knop) { knop.disabled = false; knop.textContent = 'Lijst ophalen'; }

    if (!r || r.error) { uit.innerHTML = `<p class="sync-fout">${esc(r?.error || 'Onbekende fout')}</p>`; return; }

    let html = `<p class="sync-bron">Laatst berekend: ${esc(tijdstip(r.bijgewerkt))}.
        ${r.wacht ? `${r.wacht} ${r.wacht === 1 ? 'geval wacht' : 'gevallen wachten'} nog een dag.` : ''}</p>`;

    if (!r.aantal) {
        html += '<p class="sync-gelijk">Niemand om te mailen.</p>';
        uit.innerHTML = html;
        return;
    }

    // Op speler groeperen: die krijgt één mail per gemiste training, maar je
    // wilt in één oogopslag zien wie het vaker overkomt.
    const perSpeler = {};
    for (const x of r.regels) (perSpeler[x.speler] = perSpeler[x.speler] || []).push(x);
    const namen = Object.keys(perSpeler).sort((a, b) =>
        perSpeler[b].length - perSpeler[a].length || a.localeCompare(b, 'nl'));

    html += `<p><strong>${r.aantal}</strong> ${r.aantal === 1 ? 'bericht' : 'berichten'} klaar,
        voor ${namen.length} ${namen.length === 1 ? 'speler' : 'spelers'}.</p>
        <div class="table-wrap"><table class="data">
        <thead><tr><th>Speler</th><th class="num">Keer</th><th>Trainingen</th></tr></thead><tbody>`;
    for (const naam of namen) {
        const rijen = perSpeler[naam];
        html += `<tr><td>${esc(naam)}</td><td class="num">${rijen[0].keer}</td>
            <td class="ng-details">${rijen.map(x =>
                `${esc(formatDate(x.datum))} &middot; ${esc(x.groep)}`).join('<br>')}</td></tr>`;
    }
    html += '</tbody></table></div>';
    html += `<p class="sync-let-op">Versturen gaat nog met de hand. De mailadressen staan niet in
        deze app; die worden pas bij het versturen bij Genkgo opgehaald.</p>`;
    uit.innerHTML = html;
}

/**
 * Eindoverzicht, bedoeld om af te drukken of als pdf te bewaren.
 * Per trainer (met zijn groepen eronder) of per speler (alfabetisch).
 */
function renderEind(modus) {
    const src = ADMIN_DATA || DATA;
    const perSpeler = modus === 'speler';
    const ronde = (src.genkgo || {}).ronde;

    let html = `<a href="#" class="back-link">&larr; Terug</a>
        <div class="eind-kop">
            <div>
                <h1>Eindoverzicht${ronde ? ` &mdash; ${esc(ronde.naam)}` : ''}</h1>
                <p class="lead">Aanwezigheid over alle ingevulde trainingen. Wie zich via Genkgo
                heeft afgemeld telt niet mee: die training valt uit zijn noemer, vandaar de kolom
                <em>Meegeteld</em>. Trainingen die nog niet zijn ingevuld tellen nergens in mee.</p>
            </div>
            <div class="eind-knoppen">
                <a href="#eind/trainer" class="btn-sm${perSpeler ? ' btn-muted' : ''}">Per trainer</a>
                <a href="#eind/speler" class="btn-sm${perSpeler ? '' : ' btn-muted'}">Per speler</a>
                <button class="btn-sm" onclick="window.print()">Afdrukken</button>
            </div>
        </div>`;

    if (perSpeler) {
        // Eén regel per speler per groep, op naam gesorteerd. Iemand die in
        // twee groepen zit staat dus twee keer; dat is met opzet, want zijn
        // opkomst kan per groep verschillen.
        const regels = [];
        for (const t of src.trainers) {
            for (const g of t.groups) {
                for (const ps of calcGroupStats(g).playerStats) {
                    regels.push({ ...ps, groep: g.name, trainer: t.name });
                }
            }
        }
        regels.sort((a, b) => a.player.localeCompare(b.player, 'nl'));
        html += `<div class="table-wrap"><table class="data">
            <thead><tr><th>Speler</th><th>Groep</th><th>Trainer</th>
                <th class="num">Aanwezig</th><th class="num">Afgemeld</th>
                <th class="num">Meegeteld</th><th class="num">%</th></tr></thead><tbody>`;
        for (const r of regels) {
            html += `<tr><td>${esc(r.player)}</td><td>${esc(r.groep)}</td><td>${esc(r.trainer)}</td>
                <td class="num">${r.count}</td>
                <td class="num${r.excusedCount ? '' : ' leeg'}">${r.excusedCount || '-'}</td>
                <td class="num">${r.effectiveSessions}</td>
                ${pctCel(r)}</tr>`;
        }
        html += '</tbody></table></div>';
        if (!regels.length) html += '<p class="empty">Nog niets ingevuld.</p>';
        return html;
    }

    for (const t of src.trainers) {
        if (!t.groups.length) continue;
        let som = 0, aantal = 0;
        for (const g of t.groups) {
            const st = calcGroupStats(g);
            if (st.totalSessions > 0) { som += st.avgAttendance; aantal++; }
        }
        const gem = aantal ? Math.round(som / aantal) : 0;
        html += `<section class="eind-trainer">
            <h2>${esc(t.name)} <span class="pct ${pctClass(gem)}">${gem}% gemiddeld</span></h2>`;
        for (const g of t.groups) {
            const st = calcGroupStats(g);
            html += `<h3>${esc(g.name)}
                <span class="eind-sub">${g.players.length} spelers, ${st.totalSessions}
                ${st.totalSessions === 1 ? 'training' : 'trainingen'} geteld</span></h3>
                <div class="table-wrap"><table class="data">
                <thead><tr><th>Speler</th><th class="num">Aanwezig</th>
                    <th class="num">Afgemeld</th><th class="num">Meegeteld</th>
                    <th class="num">%</th></tr></thead><tbody>`;
            for (const ps of [...st.playerStats].sort((a, b) => b.pct - a.pct)) {
                html += `<tr><td>${esc(ps.player)}</td><td class="num">${ps.count}</td>
                    <td class="num${ps.excusedCount ? '' : ' leeg'}">${ps.excusedCount || '-'}</td>
                    <td class="num">${ps.effectiveSessions}</td>
                    ${pctCel(ps)}</tr>`;
            }
            html += '</tbody></table></div>';
        }
        html += '</section>';
    }
    return html;
}

function renderGroup(trainerId, groupId) {
    let trainer, group;
    if (isAdmin() && ADMIN_DATA) {
        trainer = ADMIN_DATA.trainers.find(t => t.id === trainerId);
    } else if (TRAINER_DATA && TRAINER_DATA.id === trainerId) {
        trainer = TRAINER_DATA;
    } else {
        trainer = DATA?.trainers?.find(t => t.id === trainerId);
    }
    if (!trainer) return '<p>Trainer niet gevonden.</p>';
    group = (trainer.groups || []).find(g => g.id === groupId);
    if (!group) return '<p>Groep niet gevonden.</p>';

    const canEdit = isAdmin() || getTrainerId() === trainerId;
    const backHash = '#';

    let html = `<a href="${backHash}" class="back-link">&larr; Terug</a>
        <h1>${esc(group.name)}<span class="save-status" id="save-status"></span></h1>`;

    if (lesdagen(group).length === 0) {
        html += '<p class="empty">Nog geen lesdagen ingesteld.</p>';
        return html;
    }
    if (group.players.length === 0) {
        html += '<p class="empty">Nog geen spelers in deze groep.</p>';
        return html;
    }

    const cancelled = group.cancelled || [];
    const stats = calcGroupStats(group);

    const vandaag = new Date().toISOString().slice(0, 10);

    // Wat staat er nog open? Trainers zien dit als eerste, boven de tabel.
    const open = openTrainingen(group);
    if (open.length && canEdit) {
        const lijst = open.map(formatDate).join(', ');
        html += `<div class="todo">
            <strong>${open.length === 1 ? 'Nog in te vullen: ' + lijst : `Nog ${open.length} trainingen in te vullen: ${lijst}`}</strong>
            <span>Ging de training niet door? Vink hem dan aan in de rij <em>Vervallen?</em> &mdash;
            dan telt hij voor niemand mee. Zolang een training niet is ingevuld en niet op vervallen staat,
            telt hij nergens in mee.</span>
        </div>`;
    }

    // De lesdagen komen uit de planning in Genkgo. Verdwijnt daar een datum
    // waar al aanwezigheid voor is ingevuld, dan valt die les stil uit de
    // telling. Dat mag gebeuren -- Genkgo is leidend -- maar niet ongemerkt.
    const zwevend = buitenPlanning(group);
    if (zwevend.length && canEdit) {
        html += `<div class="todo">
            <strong>${zwevend.length === 1 ? 'Eén ingevulde training staat niet in de planning'
                : `${zwevend.length} ingevulde trainingen staan niet in de planning`}:
                ${zwevend.map(formatDate).join(', ')}</strong>
            <span>De lesdagen komen uit Genkgo. Deze datums staan daar niet (meer) bij, dus tellen ze
            nergens in mee. Klopt de planning in Genkgo niet, laat de trainingsleider hem dan aanvullen.</span>
        </div>`;
    }

    html += '<div class="att-grid"><table><thead><tr><th class="player-name">Speler</th>';
    for (const d of lesdagen(group)) {
        const isCancelled = cancelled.includes(d);
        // Een voorbije training die nog niet is ingevuld telt niet mee in de
        // percentages, maar de trainer moet wel zien dat hij openstaat.
        const open = !isCancelled && d <= vandaag && !isIngevuld(group, d);
        const komtNog = d > vandaag;
        const klassen = [isCancelled ? 'cancelled' : '', open ? 'nog-open' : '',
                         komtNog ? 'komt-nog' : ''].filter(Boolean).join(' ');
        const tip = open ? ' title="Nog niet ingevuld -- telt niet mee"'
            : komtNog ? ' title="Deze training is nog niet geweest"' : '';
        html += `<th class="${klassen}"${tip}>`
            + formatDate(d) + (open ? '<span class="open-merk">nog invullen</span>' : '') + '</th>';
    }
    html += '<th>Totaal</th><th>%</th></tr></thead><tbody>';

    // Cancel row (trainer + admin)
    if (canEdit) {
        html += '<tr class="cancel-row"><td class="player-name" style="font-size:0.75rem;color:var(--muted)">Vervallen?</td>';
        for (const d of lesdagen(group)) {
            const isCancelled = cancelled.includes(d);
            html += `<td class="${isCancelled ? 'cancelled' : ''}"><input type="checkbox" class="cancel-cb" data-date="${d}" ${isCancelled ? 'checked' : ''}></td>`;
        }
        html += '<td></td><td></td></tr>';
    }

    for (const ps of stats.playerStats) {
        html += `<tr><td class="player-name">${esc(ps.player)}</td>`;
        for (const d of lesdagen(group)) {
            const isCancelled = cancelled.includes(d);
            const present = (group.attendance?.[d] || []).includes(ps.player);
            const afgemeld = isAfgemeld(group, d, ps.player);
            const excused = (group.excused?.[d] || []).includes(ps.player) || afgemeld;
            // Een afmelding komt uit Genkgo en is hier niet te wijzigen: de
            // ledenadministratie is daarvan de bron. De trainer kan iemand
            // wel alsnog aanwezig zetten -- afgemeld en toch komen gebeurt.
            const merk = afgemeld ? ' title="Afgemeld via Genkgo" data-afgemeld="1"' : '';
            if (isCancelled) {
                html += '<td class="cancelled"></td>';
            } else if (d > vandaag) {
                // Een trainer vult in wat er is gebeurd, dus nooit vooruit.
                // Er stonden vinklijsten klaar tot in december; die telden
                // pas mee zodra de dag aanbrak en niemand zag dat aankomen.
                // De worker weigert zulke invoer ook, dit is de zichtbare
                // helft daarvan.
                html += '<td class="komt-nog"></td>';
            } else if (canEdit && isAdmin()) {
                const selClass = present ? 'val-present' : (excused ? 'val-excused' : 'val-absent');
                // Drie toestanden, en maar twee daarvan zijn een keuze:
                // aanwezig of afwezig. "Afgemeld" komt uit Genkgo en is hier
                // niet te zetten -- de clubregel is dat je je daar afmeldt,
                // dus een knop die iemand alsnog geoorloofd verklaart zou een
                // tweede bron voor hetzelfde feit zijn.
                //
                // Het endpoint /excused en de opgeslagen `excused` blijven
                // bestaan; alleen de keuze is uit de lijst.
                html += `<td${merk}><select class="att-select ${selClass}${afgemeld ? ' is-afgemeld' : ''}" data-player="${esc(ps.player)}" data-date="${d}">
                    <option value="">${afgemeld ? 'Afgemeld' : 'Afwezig'}</option>
                    <option value="present"${present ? ' selected' : ''}>Aanwezig</option>
                </select></td>`;
            } else if (canEdit) {
                html += `<td class="${afgemeld ? 'is-afgemeld' : ''}"${merk}>`
                    + `<input type="checkbox" data-player="${esc(ps.player)}" data-date="${d}" ${present ? 'checked' : ''}>`
                    + (afgemeld && !present ? '<span class="afgemeld-merk">afgemeld</span>' : '')
                    + '</td>';
            } else {
                html += `<td class="num ${present ? 'val-present' : (afgemeld ? 'is-afgemeld' : '')}"${merk}>`
                    + (present ? '✓' : (afgemeld ? 'afg.' : '')) + '</td>';
            }
        }
        html += `<td class="num total">${ps.count}</td>`;
        html += ps.effectiveSessions
            ? `<td class="num pct ${pctClass(ps.pct)}">${ps.pct}%</td></tr>`
            : '<td class="num pct leeg">-</td></tr>';
    }

    // Totals row
    html += '<tr style="font-weight:700"><td>Totaal</td>';
    for (const d of lesdagen(group)) {
        const isCancelled = cancelled.includes(d);
        if (isCancelled) {
            html += '<td class="cancelled"></td>';
        } else {
            const count = (group.attendance?.[d] || []).length;
            html += `<td class="num">${count}</td>`;
        }
    }
    html += '<td></td><td></td></tr>';

    // Total present incl. subs row
    html += '<tr style="font-weight:700"><td style="font-size:0.75rem">Totaal (incl. invallers)</td>';
    for (const d of lesdagen(group)) {
        const isCancelled = cancelled.includes(d);
        if (isCancelled) {
            html += '<td class="cancelled"></td>';
        } else if (d > vandaag) {
            html += '<td class="komt-nog"></td>';
        } else {
            const val = group.totalPresent?.[d];
            if (canEdit) {
                html += `<td><input type="number" min="0" class="total-present-input" data-date="${d}" value="${val != null ? val : ''}" style="width:3em;text-align:center"></td>`;
            } else {
                html += `<td class="num">${val != null ? val : ''}</td>`;
            }
        }
    }
    html += '<td></td><td></td></tr>';

    // Afmeldingen en overnames uit Genkgo, per datum.
    const heeftAfmeldingen = lesdagen(group).some(d => AFMELDINGEN[String(group.genkgoId)]?.[d]);
    if (heeftAfmeldingen) {
        html += '<tr><td style="font-size:0.75rem;color:var(--muted)">Afgemeld / overnames</td>';
        for (const d of lesdagen(group)) {
            if (cancelled.includes(d)) { html += '<td class="cancelled"></td>'; continue; }
            const dag = AFMELDINGEN[String(group.genkgoId)]?.[d];
            const af = dag ? dag.afzeggers.length : 0;
            const ov = dag ? dag.overnames : 0;
            html += `<td class="num" style="font-size:0.75rem;color:var(--muted)">${af || ov ? `${af}${ov ? ' / ' + ov : ''}` : ''}</td>`;
        }
        html += '<td></td><td></td></tr>';
    }

    html += '</tbody></table></div>';
    if (heeftAfmeldingen) {
        html += '<p class="legenda">Afmeldingen komen uit Genkgo en worden elke dag om 10:00 opgehaald, '
            + 'de uiterste afmeldtijd. Ze tellen niet mee als afwezig. '
            + 'Van overnames zijn geen namen bekend.</p>';
    }
    return html;
}


// --- Routing ---
async function navigate(hash) {
    const app = document.getElementById('app');
    hash = hash || location.hash.replace(/^#/, '');

    if (!DATA && hash !== 'login' && getAuth()) {
        app.innerHTML = '<p>Laden...</p>';
        // De afmeldingen zitten achter een code, dus die halen we apart op.
        // Naast elkaar: als Genkgo traag is, moet de presentielijst niet
        // daarop staan wachten.
        await Promise.all([fetchData(), fetchAfmeldingen()]);
    }

    renderNav();

    if (!getAuth() && hash !== 'login') {
        location.hash = 'login';
        return;
    }

    if (hash === 'login') {
        app.innerHTML = renderLogin();
        bindLogin();
    } else if (hash === 'overview') {
        app.innerHTML = renderOverview();
    } else if (hash === 'instellingen') {
        if (!isAdmin()) { location.hash = ''; return; }
        app.innerHTML = renderInstellingen();
        bindInstellingen();
    } else if (hash === 'eind' || hash.startsWith('eind/')) {
        if (!isAdmin()) { location.hash = ''; return; }
        app.innerHTML = renderEind(hash.split('/')[1] || 'trainer');
    } else if (hash === 'admin') {
        location.hash = '';
        return;
    } else if (hash.startsWith('group/')) {
        const [, trainerId, groupId] = hash.split('/');
        app.innerHTML = renderGroup(trainerId, groupId);
        bindAttendance(trainerId, groupId);
    } else {
        app.innerHTML = renderHome();
        bindSearch();
        if (isAdmin()) bindAdmin();
    }
}

// --- Event Binding ---
function bindLogin() {
    document.getElementById('login-form')?.addEventListener('submit', async e => {
        e.preventDefault();
        const code = document.getElementById('login-code').value.trim();
        const errEl = document.getElementById('login-error');
        errEl.style.display = 'none';
        const result = await apiLogin(code);
        if (result.ok) {
            setAuth({ code, role: result.role, trainer_id: result.trainer_id, trainer_name: result.trainer_name });
            if (result.data) ADMIN_DATA = result.data;
            if (result.trainer) TRAINER_DATA = result.trainer;
            location.hash = '';
        } else {
            errEl.textContent = result.error || 'Onjuiste code';
            errEl.style.display = 'block';
        }
    });
}

let saveTimeout = null;
function bindAttendance(trainerId, groupId) {
    // Admin: keuze tussen afwezig en aanwezig. Afgemeld komt uit Genkgo.
    document.querySelectorAll('.att-select').forEach(sel => {
        sel.addEventListener('change', () => {
            sel.className = `att-select ${sel.value === 'present' ? 'val-present' : sel.value === 'excused' ? 'val-excused' : 'val-absent'}`;

            const date = sel.dataset.date;
            const selects = document.querySelectorAll(`.att-select[data-date="${date}"]`);
            const presentPlayers = [];
            const excusedPlayers = [];
            selects.forEach(s => {
                if (s.value === 'present') presentPlayers.push(s.dataset.player);
                else if (s.value === 'excused') excusedPlayers.push(s.dataset.player);
            });

            const statusEl = document.getElementById('save-status');
            statusEl.textContent = 'Opslaan...';
            statusEl.className = 'save-status saving';

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                await apiPost('/attendance-full', { trainer_id: trainerId, group_id: groupId, date, present_players: presentPlayers, excused_players: excusedPlayers });

                await fetchData();
                const r = await apiLogin(getAuth().code);
                if (r.data) ADMIN_DATA = r.data;

                statusEl.textContent = 'Opgeslagen';
                statusEl.className = 'save-status saved';
                setTimeout(() => { statusEl.textContent = ''; }, 2000);
            }, 300);
        });
    });

    // Trainer: checkbox (Afwezig / Aanwezig)
    document.querySelectorAll('.att-grid input[type="checkbox"]:not(.cancel-cb)').forEach(cb => {
        cb.addEventListener('change', () => {
            const date = cb.dataset.date;
            const checkboxes = document.querySelectorAll(`.att-grid input[type="checkbox"][data-date="${date}"]`);
            const presentPlayers = [];
            checkboxes.forEach(c => { if (c.checked && c.dataset.player) presentPlayers.push(c.dataset.player); });

            const statusEl = document.getElementById('save-status');
            statusEl.textContent = 'Opslaan...';
            statusEl.className = 'save-status saving';

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                await apiPost('/attendance', { trainer_id: trainerId, group_id: groupId, date, present_players: presentPlayers });

                await fetchData();
                const r = await apiLogin(getAuth().code);
                if (r.trainer) TRAINER_DATA = r.trainer;

                statusEl.textContent = 'Opgeslagen';
                statusEl.className = 'save-status saved';
                setTimeout(() => { statusEl.textContent = ''; }, 2000);
            }, 300);
        });
    });

    // Total present (incl. subs) inputs
    let totalPresentTimeout = null;
    document.querySelectorAll('.total-present-input').forEach(input => {
        input.addEventListener('change', () => {
            const date = input.dataset.date;
            const total = input.value === '' ? null : parseInt(input.value, 10);

            const statusEl = document.getElementById('save-status');
            statusEl.textContent = 'Opslaan...';
            statusEl.className = 'save-status saving';

            clearTimeout(totalPresentTimeout);
            totalPresentTimeout = setTimeout(async () => {
                await apiPost('/total-present', { trainer_id: trainerId, group_id: groupId, date, total });

                await fetchData();
                if (isAdmin()) {
                    const r = await apiLogin(getAuth().code);
                    if (r.data) ADMIN_DATA = r.data;
                } else if (getTrainerId()) {
                    const r = await apiLogin(getAuth().code);
                    if (r.trainer) TRAINER_DATA = r.trainer;
                }

                statusEl.textContent = 'Opgeslagen';
                statusEl.className = 'save-status saved';
                setTimeout(() => { statusEl.textContent = ''; }, 2000);
            }, 300);
        });
    });

    // Cancel date toggles
    document.querySelectorAll('.cancel-cb').forEach(cb => {
        cb.addEventListener('change', async () => {
            const date = cb.dataset.date;
            const cancel = cb.checked;

            const statusEl = document.getElementById('save-status');
            statusEl.textContent = 'Opslaan...';
            statusEl.className = 'save-status saving';

            await apiPost('/cancel', { trainer_id: trainerId, group_id: groupId, date, cancel });

            await fetchData();
            if (isAdmin()) {
                const r = await apiLogin(getAuth().code);
                if (r.data) ADMIN_DATA = r.data;
            } else if (getTrainerId()) {
                const r = await apiLogin(getAuth().code);
                if (r.trainer) TRAINER_DATA = r.trainer;
            }

            statusEl.textContent = 'Opgeslagen';
            statusEl.className = 'save-status saved';
            setTimeout(() => navigate(), 500);
        });
    });
}

function exportToCSV() {
    const src = isAdmin() && ADMIN_DATA ? ADMIN_DATA : DATA;
    if (!src) return;

    let csv = '\uFEFF'; // BOM for Excel UTF-8
    let clubPctSum = 0, clubPctCount = 0;

    for (const trainer of src.trainers) {
        let trainerPctSum = 0, trainerPctCount = 0;

        for (const group of trainer.groups) {
            const cancelled = group.cancelled || [];
            const today = new Date().toISOString().slice(0, 10);
            const activeDates = lesdagen(group).filter(d => !cancelled.includes(d) && d <= today && isIngevuld(group, d));

            // Header
            csv += `\n${trainer.name} - ${group.name}\n`;
            csv += `Speler;${lesdagen(group).map(d => {
                const label = formatDate(d);
                return cancelled.includes(d) ? label + ' (vervallen)' : label;
            }).join(';')};Aanwezig;Totaal;Percentage\n`;

            // Player rows
            for (const player of group.players) {
                let count = 0;
                let excusedCount = 0;
                const cells = lesdagen(group).map(d => {
                    if (cancelled.includes(d)) return '';
                    const present = (group.attendance?.[d] || []).includes(player);
                    const excused = (group.excused?.[d] || []).includes(player)
                        || isAfgemeld(group, d, player);
                    if (present) count++;
                    else if (excused) excusedCount++;
                    return present ? 'x' : '';
                });
                const total = activeDates.length;
                const effectiveSessions = total - excusedCount;
                const pct = effectiveSessions > 0 ? Math.round((count / effectiveSessions) * 100) : 0;
                csv += `${player};${cells.join(';')};${count};${total};${pct}%\n`;
            }

            // Totals row
            const totals = lesdagen(group).map(d => {
                if (cancelled.includes(d)) return '';
                return (group.attendance?.[d] || []).length;
            });
            csv += `Totaal;${totals.join(';')};;;\n`;

            // Totals incl. subs row
            const totalsInclSubs = lesdagen(group).map(d => {
                if (cancelled.includes(d)) return '';
                const val = group.totalPresent?.[d];
                return val != null ? val : '';
            });
            csv += `Totaal (incl. invallers);${totalsInclSubs.join(';')};;;\n`;

            // Group average (using totalPresent when available)
            let groupAvg = 0;
            if (activeDates.length > 0 && group.players.length > 0) {
                let presentSum = 0;
                for (const d of activeDates) {
                    const tp = group.totalPresent?.[d];
                    presentSum += tp != null ? tp : (group.attendance?.[d] || []).length;
                }
                groupAvg = Math.round((presentSum / (activeDates.length * group.players.length)) * 100);
            }
            csv += `Groepsgemiddelde;${lesdagen(group).map(() => '').join(';')};;;${groupAvg}%\n`;
            if (activeDates.length > 0) { trainerPctSum += groupAvg; trainerPctCount++; }
        }

        // Trainer average
        const trainerAvg = trainerPctCount > 0 ? Math.round(trainerPctSum / trainerPctCount) : 0;
        csv += `\nGemiddelde ${trainer.name};;;;${trainerAvg}%\n`;
        clubPctSum += trainerPctSum;
        clubPctCount += trainerPctCount;
    }

    // Club average
    const clubAvg = clubPctCount > 0 ? Math.round(clubPctSum / clubPctCount) : 0;
    csv += `\nClubgemiddelde;;;;${clubAvg}%\n`;

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `aanwezigheid_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

function bindSearch() {
    document.getElementById('search-field')?.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase().trim();
        document.querySelectorAll('.trainer-card').forEach(card => {
            const text = card.dataset.search || '';
            card.style.display = (!q || text.includes(q)) ? '' : 'none';
        });
    });
}

const SYNC_LABELS = {
    'nieuwe-groep': 'Nieuwe groep',
    'wijziging': 'Gewijzigd',
    'koppeling': 'Gekoppeld aan Genkgo',
    'niet-in-genkgo': 'Staat niet meer in Genkgo',
};

/**
 * Haalt de indeling uit Genkgo.
 *
 * Eerst een proefdraai: die verandert niets en laat alleen zien wat er zou
 * gebeuren. Pas na "Toepassen" wordt er weggeschreven. Zo kan de
 * trainingsleider dit zelf doen, zonder terminal en zonder dat er per ongeluk
 * iets sneuvelt.
 */
async function syncDraaien(toepassen, metTrainers) {
    const knop = document.getElementById('sync-btn');
    const uit = document.getElementById('sync-uitslag');
    if (!uit) return;
    if (knop) { knop.disabled = true; knop.textContent = 'Bezig...'; }
    uit.innerHTML = '<p class="sync-bezig">Bezig met ophalen uit Genkgo, dit duurt een paar seconden.</p>';

    let r;
    try {
        r = await apiPost('/admin/sync', {
            ...(toepassen ? { apply: true } : {}),
            ...(metTrainers ? { trainers: true } : {}),
        });
    } catch (e) {
        r = { error: 'Genkgo niet bereikbaar: ' + e.message };
    }
    if (knop) { knop.disabled = false; knop.textContent = 'Controleren'; }

    if (!r || r.error) {
        uit.innerHTML = `<p class="sync-fout">${esc(r?.error || 'Onbekende fout')}</p>`;
        return;
    }

    const g = r.genkgo || {};
    let html = '';
    if (g.seizoen || g.ronde) {
        html += `<p class="sync-bron">Gelezen uit <strong>${esc(g.seizoen?.naam || '?')}
            &rsaquo; ${esc(g.ronde?.naam || '?')}</strong>, ${r.groepen_in_genkgo} groepen.</p>`;
    }

    // Staat er een volgende ronde klaar? Dan melden, maar niet overstappen:
    // een ronde wordt vaak over meerdere dagen ingedeeld.
    const anders = (g.rondes || []).filter(x => x.id !== g.ronde?.id && x.groepen > 0);
    if (anders.length) {
        html += `<p class="sync-let-op">Let op: ${anders.map(x =>
            `${esc(x.naam)} bevat inmiddels ${x.groepen} groep${x.groepen === 1 ? '' : 'en'}`).join(', ')}.
            De app blijft op ${esc(g.ronde?.naam || 'de huidige ronde')} staan tot iemand overstapt.</p>`;
    }

    const plan = r.plan || [];
    if (!plan.length) {
        html += '<p class="sync-gelijk">De app loopt gelijk met Genkgo, er is niets te doen.</p>';
    } else {
        const perSoort = {};
        for (const p of plan) (perSoort[p.soort] = perSoort[p.soort] || []).push(p);
        html += '<ul class="sync-plan">';
        for (const [soort, items] of Object.entries(perSoort)) {
            html += `<li><strong>${esc(SYNC_LABELS[soort] || soort)}</strong> (${items.length})<ul>`;
            for (const p of items.slice(0, 12)) {
                const extra = p.trainer ? ` &mdash; ${esc(p.trainer)}` : '';
                html += `<li>${esc(p.groep || '?')}${extra}</li>`;
            }
            if (items.length > 12) html += `<li>en nog ${items.length - 12}...</li>`;
            html += '</ul></li>';
        }
        html += '</ul>';
    }

    // Groepen van een trainer die de app nog niet kent. Die maakt de sync
    // bewust niet vanzelf aan: een tikfout in Genkgo ("Philipa" tegen
    // "Philippa") zou anders stil een tweede trainer met een eigen inlogcode
    // opleveren, terwijl de oude code naar een lege lijst wijst. Daarom wordt
    // de naam hier getoond en beslist er iemand die hem kan herkennen.
    const nieuweTrainers = {};
    for (const o of r.overgeslagen || []) {
        if (o.trainer) nieuweTrainers[o.trainer] = (nieuweTrainers[o.trainer] || 0) + 1;
    }
    const namen = Object.keys(nieuweTrainers);
    if (namen.length) {
        html += `<p class="sync-let-op"><strong>${namen.length === 1 ? 'Nieuwe trainer' : 'Nieuwe trainers'}
            in Genkgo:</strong> ${namen.map(n =>
                `${esc(n)} (${nieuweTrainers[n]} groep${nieuweTrainers[n] === 1 ? '' : 'en'})`).join(', ')}.<br>
            Klopt de schrijfwijze? Dan kun je ze toevoegen; ze krijgen een eigen inlogcode die daarna in
            dit overzicht staat. Staat er een tikfout in, verbeter die dan eerst in Genkgo.</p>`;
    }

    if (r.toegepast) {
        html += '<p class="sync-klaar">Toegepast. De pagina wordt ververst.</p>';
        uit.innerHTML = html;
        setTimeout(() => location.reload(), 1200);
        return;
    }

    if (plan.length) {
        html += '<button class="btn-sm" id="sync-apply-btn">Toepassen</button>';
    }
    if (namen.length) {
        html += `<button class="btn-sm" id="sync-trainers-btn">Toepassen en
            ${namen.length === 1 ? 'deze trainer' : 'deze trainers'} toevoegen</button>`;
    }
    uit.innerHTML = html;
    document.getElementById('sync-apply-btn')?.addEventListener('click', () => syncDraaien(true, false));
    document.getElementById('sync-trainers-btn')?.addEventListener('click', () => syncDraaien(true, true));
}

function bindAdmin() {
    // Export button
    document.getElementById('export-btn')?.addEventListener('click', exportToCSV);
    document.getElementById('sync-btn')?.addEventListener('click', () => syncDraaien(false));

    // Toggle delete mode
    document.getElementById('toggle-delete-btn')?.addEventListener('click', () => {
        document.body.classList.toggle('delete-mode');
    });

    // Add trainer
    document.getElementById('add-trainer-form')?.addEventListener('submit', async e => {
        e.preventDefault();
        const name = e.target.querySelector('input[name="name"]').value.trim();
        if (!name) return;
        const result = await apiPost('/admin/trainer', { action: 'add', name });
        if (result.data) ADMIN_DATA = result.data;
        await fetchData();
        navigate('');
    });

    // Delete trainer
    document.querySelectorAll('.delete-trainer-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const input = prompt('Typ "verwijder" om deze trainer en al zijn groepen te verwijderen:');
            if (input?.toLowerCase() !== 'verwijder') return;
            const result = await apiPost('/admin/trainer', { action: 'delete', trainer_id: btn.dataset.trainerId });
            if (result.data) ADMIN_DATA = result.data;
            await fetchData();
            navigate('');
        });
    });

    // Add group (with day, time, date range → auto-generate dates)
    document.querySelectorAll('.add-group-form').forEach(form => {
        form.addEventListener('submit', async e => {
            e.preventDefault();
            const day = form.querySelector('select[name="day"]').value;
            const startTime = form.querySelector('input[name="start_time"]').value;
            const endTime = form.querySelector('input[name="end_time"]').value;
            const startDate = form.querySelector('input[name="start_date"]').value;
            const endDate = form.querySelector('input[name="end_date"]').value;
            if (!day || !startTime || !endTime || !startDate || !endDate) return;

            const speelsterkte = form.querySelector('input[name="speelsterkte"]').value.trim();
            const selectie = form.querySelector('input[name="selectie"]').checked;
            let name = `${day} ${startTime}-${endTime}`;
            const tags = [];
            if (speelsterkte) tags.push(`Speelsterkte ${speelsterkte}`);
            if (selectie) tags.push('Selectie');
            if (tags.length) name += ` ${tags.join(' ')}`;
            const dayIndex = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'].indexOf(day) + 1;
            const dates = generateWeeklyDates(dayIndex, startDate, endDate);

            // Create group
            const result = await apiPost('/admin/group', { action: 'add', trainer_id: form.dataset.trainerId, name });
            if (result.data) {
                ADMIN_DATA = result.data;
                // Find the newly created group and set dates
                const trainer = ADMIN_DATA.trainers.find(t => t.id === form.dataset.trainerId);
                const newGroup = trainer?.groups[trainer.groups.length - 1];
                if (newGroup && dates.length > 0) {
                    const r2 = await apiPost('/admin/dates', { trainer_id: form.dataset.trainerId, group_id: newGroup.id, dates, cancelled: [] });
                    if (r2.data) ADMIN_DATA = r2.data;
                }
            }
            await fetchData();
            navigate('');
        });
    });

    // Delete group
    document.querySelectorAll('.delete-group-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const input = prompt('Typ "verwijder" om deze groep en alle aanwezigheidsdata te verwijderen:');
            if (input?.toLowerCase() !== 'verwijder') return;
            const result = await apiPost('/admin/group', { action: 'delete', trainer_id: btn.dataset.trainerId, group_id: btn.dataset.groupId });
            if (result.data) ADMIN_DATA = result.data;
            await fetchData();
            navigate('');
        });
    });

    // Edit players
    document.querySelectorAll('.edit-players-form').forEach(form => {
        form.addEventListener('submit', async e => {
            e.preventDefault();
            const text = form.querySelector('textarea[name="players"]').value;
            const players = text.split('\n').map(p => p.trim()).filter(Boolean);
            const result = await apiPost('/admin/players', { trainer_id: form.dataset.trainerId, group_id: form.dataset.groupId, players });
            if (result.data) ADMIN_DATA = result.data;
            await fetchData();
            navigate('');
        });
    });

}

    const auth = getAuth();

    } else if (auth?.role === 'trainer') {
        const r = await apiLogin(auth.code);
        if (r.ok && r.trainer) TRAINER_DATA = r.trainer;

    navigate();
});
