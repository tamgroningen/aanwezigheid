<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>De presentielijst is verhuisd</title>
<meta http-equiv="refresh" content="4;url=https://aanwezigheid.tam.nl">
<link rel="canonical" href="https://aanwezigheid.tam.nl">
<style>
  :root { --paars:#7b2d8e; --inkt:#241b2b; --papier:#faf7fb; --zacht:#6b6472; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --inkt:#f3eff5; --papier:#1a1520; --zacht:#a79fb0; --paars:#c07fd4; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--papier); color:var(--inkt);
         font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .kaart { max-width:30rem; text-align:center; }
  h1 { font-size:1.5rem; margin:0 0 .5rem; letter-spacing:-.01em; }
  p { margin:0 0 1.5rem; color:var(--zacht); }
  a.knop { display:inline-block; background:var(--paars); color:#fff; text-decoration:none;
           padding:.7rem 1.4rem; border-radius:8px; font-weight:600; }
  a.knop:focus-visible { outline:3px solid var(--paars); outline-offset:3px; }
  code { background:color-mix(in srgb, var(--paars) 12%, transparent); padding:.15em .4em;
         border-radius:4px; font-size:.95em; }
  .klein { margin-top:1.5rem; font-size:.85rem; color:var(--zacht); }
</style>
</head>
<body>
  <main class="kaart">
    <h1>De presentielijst is verhuisd</h1>
    <p>Hij staat nu op <code>aanwezigheid.tam.nl</code>. Je codewoord blijft hetzelfde.</p>
    <p><a class="knop" href="https://aanwezigheid.tam.nl">Naar de presentielijst</a></p>
    <p class="klein">Je wordt over een paar seconden vanzelf doorgestuurd.
       Sla het nieuwe adres op, dit oude adres verdwijnt op termijn.</p>
  </main>
  <script>setTimeout(function(){ location.replace("https://aanwezigheid.tam.nl"); }, 1200);</script>
</body>
</html>
